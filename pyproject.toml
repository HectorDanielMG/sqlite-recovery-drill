[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-recovery-drill"
version = "1.0.0"
description = "Consistent SQLite backups with integrity verification and safe restore drills"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Hector Daniel Marmolejo Garcia" }]
keywords = ["sqlite", "backup", "disaster-recovery", "integrity", "devops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: System :: Recovery Tools",
]

[project.scripts]
restoreguard = "restoreguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
